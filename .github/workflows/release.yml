# Build one upstream Hermes Agent release as horo-next and publish it.
#
#   upstream tag  ──overlay──▶  security bump  ──▶  front ends  ──▶  wheel  ──▶  verify on every
#   supported Python  ──▶  TestPyPI  ──▶  (approval)  ──▶  PyPI + GitHub release
#
# Upstream code is never committed to this repository. Each run clones the tag
# fresh, so a release is a pure function of (upstream tag, overlay/).
#
# Publishing uses PyPI Trusted Publishing: no API token is stored here. PyPI
# verifies the OIDC identity of this workflow + environment.
name: release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag, e.g. v2026.9.24"
        required: true
      version:
        description: "Upstream version for that tag, e.g. 0.21.5"
        required: true
      publish:
        description: "Publish after verification (false = build and verify only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pythons: ${{ steps.meta.outputs.pythons }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Builds the dashboard and TUI into the wheel, so the target machine
      # never runs npm for them. Upstream's package.json engines: ^22.22 || ^24.11.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Clone the upstream release
        run: |
          git clone --depth 1 --branch "${{ inputs.upstream_tag }}" \
            https://github.com/NousResearch/hermes-agent.git upstream

      - name: Apply the packaging overlay
        run: uv run --with packaging python overlay/horo_overlay.py upstream "${{ inputs.version }}"

      - name: Raise vulnerable direct dependencies
        run: uv run --with packaging python overlay/security_bump.py upstream --notes release-notes.md

      - name: Export the resolved dependency set
        working-directory: upstream
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --format requirements-txt \
            > "../requirements-${{ inputs.version }}.txt"

      - name: Prebuild the dashboard and TUI
        run: uv run python overlay/build_frontends.py upstream --notes release-notes.md

      - name: Build the wheel
        working-directory: upstream
        run: uv build --wheel --out-dir ../dist

      # The air-gapped target is Linux / CPython 3.12. Two install paths reach
      # it with different versions, so both are audited: the offline list
      # (pinned by the lock) and a fresh resolution of the wheel (what
      # `pip install horo-next` picks today). A core advisory on either holds
      # the release — a CVE-filtering mirror refuses the whole install if one
      # core package is blocked. Extras are reported, not held.
      - name: Audit core dependencies for Linux / Python 3.12
        run: |
          echo "## Advisory audit — Linux / Python 3.12" >> release-notes.md
          echo "dist/horo_next-${{ inputs.version }}-py3-none-any.whl" > online.in
          uv pip compile online.in --python-version 3.12 \
            --python-platform x86_64-manylinux_2_28 --no-header -q -o online-core.txt
          uv run --with packaging python overlay/audit.py "requirements-${{ inputs.version }}.txt" \
            "Core, offline list" --fail --notes release-notes.md
          uv run --with packaging python overlay/audit.py online-core.txt \
            "Core, pip install" --fail --notes release-notes.md

      - name: Report advisories in extras
        run: |
          (cd upstream && uv export --frozen --no-dev --all-extras --no-emit-project \
            --no-hashes --format requirements-txt) > "requirements-${{ inputs.version }}-all-extras.txt"
          uv run --with packaging python overlay/audit.py \
            "requirements-${{ inputs.version }}-all-extras.txt" \
            "All extras, offline list" --notes release-notes.md

      # Files for airgap/probe.py, attached to the GitHub release so the
      # air-gapped site fetches everything it needs from one page.
      - name: Map packages to the features that need them
        run: uv run python overlay/extras_map.py upstream "extras-map-${{ inputs.version }}.json"

      - id: meta
        run: echo "pythons=$(jq -c .pythons upstream/horo-build.json)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            dist/
            release-notes.md
            requirements-${{ inputs.version }}.txt
            requirements-${{ inputs.version }}-all-extras.txt
            extras-map-${{ inputs.version }}.json
            airgap/probe.py
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJson(needs.build.outputs.pythons) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Install into a clean venv and check it works
        run: |
          uv run --with packaging python overlay/verify_wheel.py \
            dist/horo_next-${{ inputs.version }}-py3-none-any.whl \
            "${{ matrix.python }}" "${{ inputs.version }}"

  testpypi:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      # skip-existing: a version can be uploaded to TestPyPI only once. Without
      # this, re-running a release whose TestPyPI rehearsal already succeeded
      # — after the PyPI step was rejected and something was fixed — fails
      # here, and the PyPI job, which needs this one, can never run. The real
      # PyPI upload below is still built and verified fresh in the same run.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # The `pypi` environment should require a reviewer (repository settings),
  # so a human approves after seeing TestPyPI. A version uploaded to PyPI can
  # never be uploaded again, even if deleted.
  pypi:
    if: inputs.publish
    needs: testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
      - name: GitHub release with notes and the offline dependency list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "horo-next ${{ inputs.version }} (upstream ${{ inputs.upstream_tag }})" \
            --notes-file release-notes.md \
            dist/*.whl \
            "requirements-${{ inputs.version }}.txt" \
            "requirements-${{ inputs.version }}-all-extras.txt" \
            "extras-map-${{ inputs.version }}.json" \
            airgap/probe.py
